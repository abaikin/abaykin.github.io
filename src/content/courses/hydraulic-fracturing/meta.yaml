summary_ru: Лекционный курс о математических моделях гидроразрыва пласта — от базовых моделей трещины (радиальная, PKN, EP3D) до моделей Planar3D ILSA и Planar3D Biot, переноса проппанта и течения в скважине.
summary_en: A lecture course on mathematical models of hydraulic fracturing — from basic fracture models (radial, PKN, EP3D) to the Planar3D ILSA and Planar3D Biot models, proppant transport and wellbore flow.
programme_note_ru: Лекции 2021 года по записям на YouTube; лекций 1–2 в записи нет.
programme_note_en: The 2021 lectures as recorded on YouTube; lectures 1–2 were not recorded.

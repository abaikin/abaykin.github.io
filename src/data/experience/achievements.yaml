# Достижения (страница «Опыт» → «Достижения»). Ключ — id записи.
# kind: letter — благодарственное письмо, award — награда, премия, стипендия, конкурс (документ о достижении).
# date — 2024, 2025-09 или TODO; pdf — скан в public/assets/ (нет — на странице «скан будет добавлен»).
# talk — связанное выступление (id в src/content/talks/), funding — связанный грант (id в funding.yaml).
# Источники: документы владельца, резюме (2026), текст диссертации (2016, с. 20–21).
# translation: auto — английские тексты переведены машинно, проверьте.


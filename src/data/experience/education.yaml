  # Аннотация — абзацы автореферата (с. 4–6) без изменений, кроме связок «В связи с этим» и «Кроме этого … также»
  abstract_ru: |-
    Целью диссертационной работы является разработка численного подхода для эффективного решения задачи гидроразрыва в неоднородной пороупругой среде и его применение к детальному исследованию влияния порового давления и неоднородностей породы на динамику развития трещины ГРП.

    Для моделирования развития трещины ГРП в неоднородной пороупругой среде разработан новый численный алгоритм на основе метода конечных элементов. Отличительной особенностью алгоритма является то, что задача формулируется в единой слабой постановке, позволяющей одновременно решать двумерные уравнения равновесия и фильтрации и одномерное уравнение для течения жидкости по трещине. В предложенном численном подходе нет необходимости перестраивать расчетную область, явно отслеживать положение вершины трещины и делать априорные предположения относительно поведения решения вблизи нее, что существенно расширяет класс решаемых задач. Для задачи о стационарной полубесконечной трещине в пороупругой среде построено новое точное автомодельное решение, для которого была дана физическая интерпретация и которое использовалось для верификации численного подхода.

    В ходе исследования показано, что при наличии неоднородности проницаемости среды роль порового давления усиливается, что качественно влияет на направление распространения трещины ГРП и ее геометрические характеристики. Кроме этого обнаружено, что в среде со слоистой структурой контраст сжимающих напряжений даже в 1 % приводит к несимметричному распространению трещины.
  abstract_en: |-
    The aim of the thesis is to develop a numerical approach for efficiently solving the hydraulic fracturing problem in an inhomogeneous poroelastic medium and to apply it to a detailed study of how pore pressure and rock inhomogeneities affect the dynamics of hydraulic fracture growth.

    A new finite element algorithm is developed for modelling hydraulic fracture propagation in an inhomogeneous poroelastic medium. Its distinctive feature is a single weak formulation that solves the two-dimensional equilibrium and filtration equations together with the one-dimensional equation of fluid flow in the fracture. The approach does not require remeshing, explicit tracking of the fracture tip or a priori assumptions about the solution near the tip, which considerably widens the class of problems that can be solved. A new exact self-similar solution is constructed for a stationary semi-infinite fracture in a poroelastic medium; it is given a physical interpretation and used to verify the numerical approach.

    The study shows that permeability inhomogeneity strengthens the role of pore pressure, which qualitatively affects the direction of fracture propagation and its geometry. It is also found that in a layered medium even a 1 % contrast in confining stresses leads to asymmetric fracture growth.

bio_ru: |
  Кандидат физико-математических наук, заведующий лабораторией программных систем оптимизации добычи углеводородов Новосибирского государственного университета.

  Занимаюсь математическим моделированием гидроразрыва пласта и связанных с ним процессов фильтрации, разрабатываю численные методы механики сплошных сред и инженерное программное обеспечение для нефтегазовой отрасли.
bio_en: |
  Candidate of Sciences (PhD) in Physics and Mathematics, Head of the Laboratory of Software Systems for Hydrocarbon Production Optimization at Novosibirsk State University.

  I work on mathematical modelling of hydraulic fracturing and the related flow in porous media, and develop numerical methods of continuum mechanics and engineering software for the oil and gas industry.

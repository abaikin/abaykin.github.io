# Внешние источники, по которым собраны и сверяются данные о публикациях.
# На странице «Публикации» — неприметная кнопка «Источники данных»: она раскрывает этот список.
# Сверка с источниками и любые правки данных по её итогам — только по команде владельца (см. CLAUDE.md).
# Ключ — идентификатор; order — порядок в списке; what_* — что берётся из источника.


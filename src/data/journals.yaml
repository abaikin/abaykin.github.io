# Журналы: категория ВАК и уровень «Белого списка».
# Публикация находит журнал по ISSN (поле issn в publications.bib), а если ISSN нет — по названию (journal = name_ru или name_en).
#
# vak — категория журнала в Перечне ВАК: K1, K2, K3 (латиницей; на сайте пишется «К1»).
#   vak_basis: list    — категория из «Распределения журналов Перечня по категориям К1, К2, К3»
#                        (категорирование 01.01.2024; копия списка: spmi.ru/sites/default/files/zashita/kategorirovanie-perechnya.pdf);
#   vak_basis: equated — журнал входит в WoS, Scopus, MathSciNet, zbMATH, Springer или GeoRef:
#                        по письму ВАК от 06.12.2022 № 02-1198 такие журналы приравниваются к К1.
#   Для зарубежных журналов категория ВАК не указывается: у них видны WoS и Scopus.
# white_list — уровень в «Белом списке» (1 — высший, 4 — низший), white_list_year — год утверждения уровня.
#   Источник: journalrank.rcsi.science (РЦНИ), проверено 19.10.2026; действует последний утверждённый уровень.

